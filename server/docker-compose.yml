services:
  asr:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - models:/models
    expose:
      - "8765"

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - asr

volumes:
  models:
  caddy_data:
  caddy_config:
